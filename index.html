<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoo Director</title>
  <meta name="description" content="A realistic 3D zoo-management simulation: budgets, politics, AZA breeding programs, disasters and the animals themselves.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Luckiest+Guy&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="start-screen"></div>

  <div id="game" class="hidden">
    <div id="view">
      <canvas id="map"></canvas>
      <div id="overlay"></div>
      <div id="tooltip"></div>
      <div id="walkhud"></div>
    </div>
    <div id="badge"></div>
    <div id="ticker"></div>
    <div id="clock"></div>
    <section id="window" class="hidden">
      <header><h2 id="wintitle"></h2><button class="winclose" data-winclose="1" title="Close (Esc)">×</button></header>
      <div id="panel"></div>
    </section>
    <footer id="bottombar">
      <div id="statsbar"></div>
      <nav id="toolbar"></nav>
      <div id="controls"></div>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/data/species.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/data/zoos.js"></script>
  <script src="js/data/director.js"></script>
  <script src="js/sim/animals.js"></script>
  <script src="js/sim/staff.js"></script>
  <script src="js/sim/infra.js"></script>
  <script src="js/sim/habitats.js"></script>
  <script src="js/sim/economy.js"></script>
  <script src="js/sim/aza.js"></script>
  <script src="js/sim/politics.js"></script>
  <script src="js/sim/development.js"></script>
  <script src="js/sim/design.js"></script>
  <script src="js/sim/events.js"></script>
  <script src="js/sim/donors.js"></script>
  <script src="js/sim/officials.js"></script>
  <script src="js/sim/partner.js"></script>
  <script src="js/sim/media.js"></script>
  <script src="js/sim/zooevents.js"></script>
  <script src="js/sim/merch.js"></script>
  <script src="js/sim/diagnose.js"></script>
  <script src="js/sim/requests.js"></script>
  <script src="js/sim/growth.js"></script>
  <script src="js/sim/reserve.js"></script>
  <script src="js/sim/fieldcons.js"></script>
  <script src="js/sim/campaigns.js"></script>
  <script src="js/sim/corps.js"></script>
  <script src="js/sim/sim.js"></script>
  <script src="js/ui/models.js"></script>
  <script src="js/ui/settings3d.js"></script>
  <script src="js/ui/world3d.js"></script>
  <script src="js/ui/portraits.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/ui/panels2.js"></script>
  <script src="js/ui/architect.js"></script>
  <script src="js/ui/creator.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
