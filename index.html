<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoo Director</title>
  <meta name="description" content="A realistic zoo-management simulation: budgets, politics, AZA breeding programs, disasters and the animals themselves.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦒</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="start-screen"></div>

  <div id="game" class="hidden">
    <header id="topbar"></header>
    <main>
      <div id="map-wrap">
        <canvas id="map"></canvas>
        <div id="tooltip"></div>
        <div id="walkhud"></div>
      </div>
      <aside id="sidebar">
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </aside>
    </main>
    <footer id="ticker"></footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="js/core/util.js"></script>
  <script src="js/data/species.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/data/zoos.js"></script>
  <script src="js/data/director.js"></script>
  <script src="js/sim/animals.js"></script>
  <script src="js/sim/staff.js"></script>
  <script src="js/sim/infra.js"></script>
  <script src="js/sim/habitats.js"></script>
  <script src="js/sim/economy.js"></script>
  <script src="js/sim/aza.js"></script>
  <script src="js/sim/politics.js"></script>
  <script src="js/sim/development.js"></script>
  <script src="js/sim/events.js"></script>
  <script src="js/sim/sim.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/ui/creator.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
