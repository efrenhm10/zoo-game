<!doctype html>
<html><head><meta charset="utf-8"><title>Model gallery</title>
<link rel="stylesheet" href="../css/style.css">
<style>html,body{overflow:auto;background:#3d5a2a} .g{display:grid;grid-template-columns:repeat(7,1fr);gap:18px 6px;padding:20px}.g div{display:flex;flex-direction:column;align-items:center}</style></head>
<body><div class="g" id="g"></div>
<script src="../js/vendor/three.min.js"></script>
<script src="../js/core/util.js"></script><script src="../js/data/species.js"></script>
<script src="../js/ui/models.js"></script><script src="../js/ui/portraits.js"></script>
<script>
ZG.Models.buildScenery();
const g = document.getElementById('g');
for (const id of Object.keys(ZG.SPECIES)) { const d = document.createElement('div'); d.innerHTML = ZG.Portraits.img(id, 'portrait lg') + `<span class="banner">${ZG.SPECIES[id].name}</span>`; g.appendChild(d); }
</script></body></html>
